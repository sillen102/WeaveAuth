[workspace]
members = ["hooks", "bff", "common", "common/macros", "launcher", "login", "system-tests"]
resolver = "2"

[profile.dev]
debug = 0
incremental = true

[profile.dev.package."*"]
debug = 0
opt-level = 0

[workspace.dependencies]
axum = "0.8"
axum-reverse-proxy = "2.2"
jsonwebtoken = "11.1"
openidconnect = { version = "4.0", default-features = false }
tokio = "1"
rustix = "1.1"
ipnet = "2"
tower-http = "0.7"
tower_governor = "0.8"
governor = "0.10"
serde = "1"
serde_json = "1"
figment = "0.10"
dotenvy = "0.15"
reqwest = "0.13"
tracing = "0.1"
trybuild = "1"
tracing-subscriber = "0.3"
anyhow = "1"
thiserror = "2"
uuid = "1"
futures-util = "0.3"
chrono = "0.4"
url = "2"
percent-encoding = "2"
http = "1.5"
sha2 = "0.11"
base64 = "0.23"
rand = "0.10"
tera = "2"
secrecy = "0.10"

# Test utilities
tower = "0.5"
testcontainers = { version = "0.28", default-features = false }
dtor = "1"
