[tasks.dev]
description = "Run development in dev mode"
# Only on this task: login reads no config.yaml, and the tests expect the prod default.
env = { WA_PROFILE = "dev" }
run = "cargo run"

[tasks.build]
description = "Build the project"
run = "cargo build"

[tasks.test]
description = "Run tests"
run = "cargo test"

[tasks.lint]
description = "Run linters"
run = "cargo clippy --all-targets -- -D warnings"
