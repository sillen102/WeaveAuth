[package]
name = "weaveauth-bff"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { path = "../common" }
common-macros = { path = "../common/macros" }
thiserror = { workspace = true }

axum = { workspace = true }
axum-reverse-proxy = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tower-http = { workspace = true, features = ["trace", "cors", "set-header"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
anyhow = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
chrono = { workspace = true, features = ["serde"] }
reqwest = { workspace = true, features = ["form", "json"] }
sha2 = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
url = { workspace = true }
secrecy = { workspace = true, features = ["serde"] }
percent-encoding = { workspace = true }
figment = { workspace = true, features = ["yaml", "env", "test"] }
tower_governor = { workspace = true }
ipnet = { workspace = true, features = ["serde"] }
openidconnect = { workspace = true }
futures-util = { workspace = true }
jsonwebtoken = { workspace = true, features = ["rust_crypto"] }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
