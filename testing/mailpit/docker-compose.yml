# Local SMTP sink for the verification email: `docker compose up -d`, then
# point backend's email_handler at 127.0.0.1:1025 (tls: none) and read the mail
# in the web UI at http://localhost:7025.
services:
  mailpit:
    image: axllent/mailpit:v1.31
    hostname: mail
    container_name: mailpit
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "127.0.0.1:7025:8025"
      - "127.0.0.1:7026:8026"
      - "127.0.0.1:1025:1025"
