redirect_uri_allowlist:
  - http://localhost:8080/downstream
pkce_code_ttl_secs: 300
# Third-party OIDC login, e.g. Google. Client registered at
# https://console.cloud.google.com/apis/credentials. redirect_uri must be
# bff's public URL (backend itself isn't internet-exposed) -- add it to the
# client's "Authorized redirect URIs".
#
# client_id/client_secret below are placeholders -- real values go in a local
# .env (see .env.example), which overrides these via WA_OIDC_GOOGLE_CLIENT_ID
# / WA_OIDC_GOOGLE_CLIENT_SECRET and is git-ignored, so nothing secret ends up
# in this file.
oidc_providers:
  google:
    client_id: set-in-.env
    client_secret: set-in-.env
    issuer: https://accounts.google.com
    redirect_uri: http://localhost:8080/oidc/google/callback
    # What the consent screen asks for besides `openid`. contacts.readonly is for the
    # phone number: Google only returns it from the user's own contact card, and the
    # scope reads ALL of their contacts.
    scopes:
      - email
      - profile
      - https://www.googleapis.com/auth/contacts.readonly
    # Sent to extra_data_handler on first login: field name -> id_token claim.
    extra_claims:
      first_name: given_name
      last_name: family_name
    # Claims that aren't in the id_token: GET with the access token, field name -> JSON pointer.
    profile_apis:
      - url: https://people.googleapis.com/v1/people/me?personFields=phoneNumbers
        required: false
        # Skipped (or, if required, the login refused) when the user unticks this permission.
        scope: https://www.googleapis.com/auth/contacts.readonly
        claims:
          phone_number: /phoneNumbers/0/canonicalForm
# Local-testing webhooks served by testing/downstream-service.
extra_data_handler:
  kind: webhook
  url: http://localhost:10001/hooks/register
login_claims_handler:
  kind: webhook
  url: http://localhost:10001/hooks/login-claims
# Verification email, sent to Mailpit (testing/mailpit/docker-compose.yml; inbox at http://localhost:7025).
login_public_url: http://localhost:8081
email_handler:
  kind: smtp
  host: 127.0.0.1
  port: 1025
  tls: none
  from: WeaveAuth <no-reply@example.com>
