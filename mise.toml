monorepo_root = true

[tools]
rust = "1.98"
"cargo:cargo-mutants" = "latest"

[monorepo]
config_roots = [
    "backend",
    "bff",
    "common",
    "common/macros",
    "login",
    "testing/downstream-service",
    "testing/user-service",
]

[tasks.build]
depends = [
    { task = "//backend:build" },
    { task = "//bff:build" },
    { task = "//common:build" },
    { task = "//login:build" },
]

[tasks.test]
depends = [
    { task = "//backend:test" },
    { task = "//bff:test" },
    { task = "//common:test" },
    { task = "//login:test" },
]

[tasks.lint]
description = "Run linters for all services and common code"
depends = [
    { task = "//backend:lint" },
    { task = "//bff:lint" },
    { task = "//common:lint" },
    { task = "//login:lint" },
]

[tasks.services]
description = "Run all services"
depends = [
    { task = "//backend:dev" },
    { task = "//bff:dev" },
    { task = "//login:dev" },
]

[tasks.test-apps]
description = "Run applications in testing folder, meant for local testing only"
depends = [
    { task = "//testing/downstream-service:dev" },
    { task = "//testing/user-service:dev" },
]

[tasks.all]
description = "Run all applications, including testing apps"
depends = [
    { task = "services" },
    { task = "test-apps" },
]

[tasks.mutants]
description = "Run cargo-mutants for a crate (usage: mise run mutants -- -p weaveauth)"
run = "cargo mutants"
env = { CARGO_INCREMENTAL = "1" }
