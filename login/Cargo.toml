[package]
name = "weaveauth-login"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { workspace = true }
common = { path = "../common" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tower-http = { workspace = true, features = ["fs", "set-header"] }
tower_governor = { workspace = true }
ipnet = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
figment = { workspace = true, features = ["yaml", "env", "test"] }
tera = { workspace = true, features = ["glob_fs"] }
url = { workspace = true }
percent-encoding = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
thiserror = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
tempfile = { workspace = true }
