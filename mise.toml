monorepo_root = true

[tools]
rust = "1.98"
"cargo:cargo-mutants" = "latest"
"cargo:cargo-crap" = "latest"

[monorepo]
config_roots = [
    "backend",
    "bff",
    "common",
    "common/macros",
    "login",
    "plugin-sdk/go",
    "plugin-sdk/rust",
    "testing/downstream-service",
    "testing/user-service",
]

[tasks.build]
depends = [
    { task = "//backend:build" },
    { task = "//bff:build" },
    { task = "//common:build" },
    { task = "//login:build" },
    { task = "//plugin-sdk/go:build" },
    { task = "//plugin-sdk/rust:build" },
]

[tasks.test]
depends = [
    { task = "//plugin-sdk/go:test" },
]
run = "cargo test --workspace"

[tasks.system-tests]
description = "Run cross-service system tests (excludes the Docker-gated ones, see test-docker)"
run = "cargo test -p weaveauth-system-tests"

[tasks.lint]
description = "Run linters for all services and common code"
depends = [
    { task = "//backend:lint" },
    { task = "//bff:lint" },
    { task = "//common:lint" },
    { task = "//login:lint" },
    { task = "//plugin-sdk/go:lint" },
    { task = "//plugin-sdk/rust:lint" },
]

[tasks.services]
description = "Run all services"
depends = [
    { task = "//backend:dev" },
    { task = "//bff:dev" },
    { task = "//login:dev" },
]

[tasks.test-apps]
description = "Run applications in testing folder, meant for local testing only"
depends = [
    { task = "//testing/downstream-service:dev" },
    { task = "//testing/user-service:dev" },
]

[tasks.all]
description = "Run all applications, including testing apps"
depends = [
    { task = "services" },
    { task = "test-apps" },
]

[tasks.test-docker]
description = "Run the system tests that need a Docker daemon (real Postgres via testcontainers)"
run = "cargo test -p weaveauth-system-tests --features docker"

[tasks.mutants]
description = "Run cargo-mutants for a crate (usage: mise run mutants -- -p weaveauth)"
run = "cargo mutants"
