[package]
name = "weaveauth"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { path = "../common" }
common-macros = { path = "../common/macros" }

axum = { workspace = true }
aide = { workspace = true, features = ["axum", "axum-json", "axum-query", "axum-form", "scalar"] }
schemars = { workspace = true, features = ["chrono04", "uuid1"] }
tokio = { workspace = true, features = ["full"] }
tower-http = { workspace = true, features = ["trace"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
figment = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
chrono = { workspace = true, features = ["serde"] }
sha2 = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
argon2 = { workspace = true }
jsonwebtoken = { workspace = true , features = ["rust_crypto"] }
rsa = { workspace = true, features = ["pem"] }

[dev-dependencies]
tower = { workspace = true }
url = { workspace = true }
