[package]
name = "weaveauth-system-tests"
version = "0.1.0"
edition = "2024"
publish = false

[features]
# Tests that need a Docker daemon: they run the real Ory stack (Kratos, Hydra,
# Postgres, Mailpit) via testcontainers, with hooks, bff and login in-process.
# Off by default so `cargo test` stays runnable without it.
docker = ["dep:testcontainers", "dep:dtor"]

[dependencies]
weaveauth-bff = { path = "../bff" }
weaveauth-hooks = { path = "../hooks" }
weaveauth-login = { path = "../login" }
tokio = { workspace = true, features = ["full"] }
anyhow = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true, features = ["form", "json"] }
jsonwebtoken = { workspace = true, features = ["rust_crypto"] }
secrecy = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
sha2 = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
chrono = { workspace = true }
testcontainers = { workspace = true, features = ["aws-lc-rs"], optional = true }
dtor = { workspace = true, optional = true }
