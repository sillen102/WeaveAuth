[package]
name = "pg-probe"
version = "0.1.0"
edition = "2024"
publish = false

# Its own workspace: this crate builds for wasm32-unknown-unknown with a
# different dependency set, so it deliberately isn't a member of the root
# workspace. Built on demand by backend's plugin end-to-end tests.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
extism-pdk = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
weaveauth-plugin-sdk = { path = "../../../../../plugin-sdk/rust" }

[profile.release]
opt-level = "s"
strip = true
