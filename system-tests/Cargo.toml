[package]
name = "weaveauth-system-tests"
version = "0.1.0"
edition = "2024"
publish = false

[features]
# Tests that need a Docker daemon: they run a real Postgres via
# testcontainers. Off by default so `cargo test` stays runnable without it.
docker = ["dep:testcontainers", "dep:tokio-postgres"]

[dependencies]
testcontainers = { workspace = true, optional = true }
tokio-postgres = { workspace = true, optional = true }

[dev-dependencies]
weaveauth = { path = "../backend" }
weaveauth-bff = { path = "../bff" }
axum = { workspace = true }
tokio = { workspace = true, features = ["full"] }
reqwest = { workspace = true, features = ["json", "cookies"] }
wiremock = { workspace = true }
jsonwebtoken = { workspace = true, features = ["rust_crypto"] }
rsa = { workspace = true, features = ["pem"] }
base64 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["v4", "serde"] }
url = { workspace = true }
anyhow = { workspace = true }
