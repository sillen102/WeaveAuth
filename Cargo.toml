[workspace]
members = ["backend", "bff", "common", "common/macros", "login", "system-tests"]
resolver = "2"

[profile.dev]
debug = 0
incremental = true

[profile.dev.package."*"]
debug = 0
opt-level = 0

[workspace.dependencies]
axum = "0.8"
aide = "0.16.0-alpha.4"
schemars = "1.2"
async-trait = "0.1"
argon2 = "0.6"
bcrypt = "0.19"
extism = { version = "1", default-features = false }
jsonwebtoken = "11.1"
openidconnect = { version = "4.0", default-features = false }
rsa = "0.9"
tokio = "1"
tower-http = "0.7"
serde = "1"
serde_json = "1"
figment = "0.10"
dotenvy = "0.15"
reqwest = "0.13"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
thiserror = "2"
uuid = "1"
chrono = "0.4"
url = "2"
percent-encoding = "2"
http = "1.5"
sha2 = "0.11"
base64 = "0.23"
rand = "0.10"
strum = "0.28"
email_address = "0.2"
native-tls = "0.2"
tera = "2"
secrecy = "0.10"

# Test utilities
tower = "0.5"
wiremock = "0.6"
testcontainers = "0.28"
tokio-postgres = "0.7"
wat = "1"