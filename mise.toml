monorepo_root = true

[tools]
rust = { version = "1.98", components = "llvm-tools-preview" }
"cargo:cargo-mutants" = "latest"
"cargo:cargo-crap" = "latest"
"cargo:cargo-llvm-cov" = "latest"

[monorepo]
config_roots = [
    "backend",
    "bff",
    "common",
    "common/macros",
    "login",
    "plugin-sdk/go",
    "plugin-sdk/rust",
    "testing/downstream-service",
    "testing/user-service",
]

[tasks.build]
depends = [
    { task = "//backend:build" },
    { task = "//bff:build" },
    { task = "//common:build" },
    { task = "//login:build" },
    { task = "//plugin-sdk/go:build" },
    { task = "//plugin-sdk/rust:build" },
]

[tasks.test]
depends = [
    { task = "//plugin-sdk/go:test" },
]
run = "cargo test --workspace"

[tasks.system-tests]
description = "Run cross-service system tests (excludes the Docker-gated ones, see test-docker)"
run = "cargo test -p weaveauth-system-tests"

[tasks.format]
description = "Format Rust code with rustfmt and Go code with gofmt"
run = [
    "cargo fmt --all",
    "cd plugin-sdk/go && gofmt -w .",
]

[tasks.lint]
description = "Run linters for all services and common code"
depends = [
    { task = "//backend:lint" },
    { task = "//bff:lint" },
    { task = "//common:lint" },
    { task = "//login:lint" },
    { task = "//plugin-sdk/go:lint" },
    { task = "//plugin-sdk/rust:lint" },
]

[tasks.services]
description = "Run all services"
depends = [
    { task = "//backend:dev" },
    { task = "//bff:dev" },
    { task = "//login:dev" },
]

[tasks.test-apps]
description = "Run applications in testing folder, meant for local testing only"
depends = [
    { task = "//testing/downstream-service:dev" },
    { task = "//testing/user-service:dev" },
]

[tasks.all]
description = "Run all applications, including testing apps"
depends = [
    { task = "services" },
    { task = "test-apps" },
]

[tasks.test-docker]
description = "Run the system tests that need a Docker daemon (real Postgres, the shipped image's plugin privilege separation)"
run = [
    "docker build -t weaveauth .",
    "docker build -f system-tests/docker/Dockerfile.plugin-test -t weaveauth-plugin-test .",
    "cargo test -p weaveauth-system-tests --features docker",
]

[tasks.mutants]
description = "Run cargo-mutants for a crate (usage: mise run mutants -- -p weaveauth)"
run = "cargo mutants"

[tasks.crap]
description = "Report CRAP scores per function (coverage from cargo test --workspace); fails if a function scores above 30"
run = [
    "cargo llvm-cov --workspace --lcov --output-path lcov.info",
    "cargo crap --workspace --lcov lcov.info --exclude '**/tests/**' --exclude '**/main.rs' --exclude '**/build.rs' --min 30 --fail-above",
]

[tasks.upgrade-rust]
description = "Upgrade Cargo workspace dependencies"
run = "cargo update"

[tasks.upgrade-go]
description = "Upgrade Go plugin SDK dependencies"
run = "cd plugin-sdk/go && go get -u ./..."

[tasks.upgrade]
description = "Upgrade all dependencies (Cargo workspace + Go plugin SDK)"
depends = [
    { task = "upgrade-rust" },
    { task = "upgrade-go" },
]
