[package]
name = "weaveauth-plugin-sdk"
version = "0.1.0"
edition = "2024"
publish = false

# Its own workspace: consumers build for wasm32-unknown-unknown with their
# own dependency set, so this deliberately isn't a member of the root
# workspace (see system-tests/tests/fixtures/plugins/pg-probe/Cargo.toml for
# the same pattern on the consumer side).
[workspace]

[dependencies]
base64 = "0.23"
extism-pdk = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
