monorepo_root = true

[settings]
jobs = 8

[tools]
rust = { version = "1.98", components = "llvm-tools-preview" }
"cargo:cargo-mutants" = "latest"
"cargo:cargo-crap" = "latest"
"cargo:cargo-llvm-cov" = "latest"

[monorepo]
config_roots = [
    "hooks",
    "bff",
    "common",
    "common/macros",
    "login",
    "testing/downstream-service",
    "testing/user-service",
]

[tasks.build]
depends = [
    { task = "//hooks:build" },
    { task = "//bff:build" },
    { task = "//common:build" },
    { task = "//login:build" },
]
run = "cargo build -p weaveauth-launcher -p weaveauth-system-tests"

[tasks.test]
run = "cargo test --workspace"

[tasks.system-tests]
description = "Run cross-service system tests (excludes the Docker-gated ones, see test-docker)"
run = "cargo test -p weaveauth-system-tests"

[tasks.format]
description = "Format Rust code with rustfmt"
run = "cargo fmt --all"

[tasks.lint]
description = "Run linters for all services and common code"
depends = [
    { task = "//hooks:lint" },
    { task = "//bff:lint" },
    { task = "//common:lint" },
    { task = "//login:lint" },
]
run = "cargo clippy -p weaveauth-launcher -p weaveauth-system-tests --all-targets -- -D warnings"

[tasks.ory-up]
description = "Start Postgres, Ory Kratos and Hydra, and the shipped image, behind TLS (see local-prod/README.md; run local-prod/gen-certs.sh and gen-secrets.sh once)"
run = "docker compose -f local-prod/docker-compose.yml up -d --build"

[tasks.ory-down]
description = "Stop the local-prod stack and drop its data"
run = "docker compose -f local-prod/docker-compose.yml down -v"

[tasks.rotate-keys]
description = "Rotate Hydra's JWT access token and id token signing keys in the local-prod stack (see ory/README.md for removing the old keys)"
run = [
    "docker compose -f local-prod/docker-compose.yml exec -e ORY_SDK_URL=http://127.0.0.1:4445 hydra-admin hydra create jwks hydra.jwt.access-token --alg RS256 --use sig",
    "docker compose -f local-prod/docker-compose.yml exec -e ORY_SDK_URL=http://127.0.0.1:4445 hydra-admin hydra create jwks hydra.openid.id-token --alg RS256 --use sig",
]

[tasks.dev-ory-up]
description = "Start Postgres, Kratos, Hydra and Mailpit in Docker for the host-run services (see dev/docker-compose.yml)"
run = ["sh dev/render.sh", "docker compose -f dev/docker-compose.yml up -d"]

[tasks.dev-ory-down]
description = "Stop the dev Ory stack and drop its data"
run = "docker compose -f dev/docker-compose.yml down -v"

[tasks.services]
description = "Run hooks, bff and login on the host (Ory is not started; see dev-ory-up, or all)"
depends = [
    { task = "//hooks:dev" },
    { task = "//bff:dev" },
    { task = "//login:dev" },
]

[tasks.test-apps]
description = "Run applications in testing folder, meant for local testing only"
depends = [
    { task = "//testing/downstream-service:dev" },
    { task = "//testing/user-service:dev" },
]

[tasks.all]
description = "Run the whole stack: Postgres, Kratos and Hydra in Docker, plus hooks, bff, login and the testing apps on the host"
depends = [
    { task = "dev-ory-up" },
    { task = "services" },
    { task = "test-apps" },
]

[tasks.test-docker]
description = "Run the system tests that need a Docker daemon (real Kratos, Hydra and Postgres via testcontainers)"
run = "cargo test -p weaveauth-system-tests --features docker"

[tasks.mutants]
description = "Run cargo-mutants for a crate (usage: mise run mutants -- -p weaveauth-hooks)"
run = "cargo mutants"

[tasks.crap]
description = "Report CRAP scores per function (coverage from cargo test --workspace); fails if a function scores above 30"
run = [
    "cargo llvm-cov --workspace --lcov --output-path lcov.info",
    "cargo crap --workspace --lcov lcov.info --exclude '**/tests/**' --exclude '**/main.rs' --exclude '**/build.rs' --min 30 --fail-above",
]

[tasks.upgrade-rust]
description = "Upgrade Cargo workspace dependencies"
run = "cargo update"

[tasks.upgrade]
description = "Upgrade all dependencies"
depends = [
    { task = "upgrade-rust" },
]
