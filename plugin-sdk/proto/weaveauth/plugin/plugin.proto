syntax = "proto3";

package weaveauth.plugin;

option go_package = "github.com/sillen102/WeaveAuth/plugin-sdk/go;weaveauth";

import "google/protobuf/struct.proto";

// Implemented by a deployer-supplied plugin process. WeaveAuth dials it over
// a unix socket whose path arrives in `WA_PLUGIN_SOCKET`, and calls one
// generic rpc at a point in a flow, selected by `hook` -- adding a new flow
// (registration, login claims, an email notification, ...) is a new hook
// name a plugin recognizes, not a new rpc.
service Plugin {
  // `OK` with no `data` (or a plugin not wired into `hook` at all, via
  // `UNIMPLEMENTED`) accepts a hook that only cares about accept/reject, like
  // registration. `OK` with `data` set returns hook-specific output, like
  // login-claims's extra JWT claims. Any other status rejects/fails the
  // caller's flow the same way -- a timeout, a crash, or a plugin that isn't
  // running fails it too.
  rpc Invoke(PluginRequest) returns (PluginResponse);
}

message PluginRequest {
  // Which flow this call belongs to, e.g. "registration" or "login_claims" --
  // lets one plugin process implement more than one hook.
  string hook = 1;
  string user_id = 2;
  string email = 3;
  // Hook-specific input: registration's extra fields, or unset for a hook
  // that needs nothing beyond user_id/email.
  google.protobuf.Struct data = 4;
}

message PluginResponse {
  // Hook-specific output, e.g. login-claims's extra JWT claims. Unset for a
  // hook that only accepts/rejects.
  google.protobuf.Struct data = 1;
}
